name: rexarr
services:
  rexarr:
    image: ghcr.io/moonlightlaboratory/rexarr:latest
    container_name: rexarr
    network_mode: bridge
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      UMASK: "002"
      TZ: $TZ
    ports:
      - target: 3939
        published: "3939"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media
        target: /DATA/Media
    devices:
      - /dev/dri:/dev/dri
    deploy:
      resources:
        reservations:
          memory: "512M"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3939/api/health"]
      interval: 1m
      timeout: 10s
      retries: 3
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: User id Rexarr runs as. Set it to whoever owns your media.
        - container: PGID
          description:
            en_US: Group id Rexarr runs as.
        - container: UMASK
          description:
            en_US: File mode mask for everything Rexarr writes. 002 keeps files group-writable.
        - container: TZ
          description:
            en_US: Time zone.
      ports:
        - container: "3939"
          description:
            en_US: Rexarr's web interface.
      volumes:
        - container: /config
          description:
            en_US: Settings, profiles, job and disc history, cache and logs.
        - container: /DATA/Media
          description:
            en_US: Your media, mounted at the same path Radarr and Sonarr see it.
      devices:
        - container: /dev/dri
          description:
            en_US: Intel GPU for QuickSync / VAAPI hardware encoding. Remove it on a machine without one.
x-casaos:
  id: co.moonlightlabs.rexarr
  architectures:
    - amd64
    - arm64
  main: rexarr
  author: MoonlightLaboratory
  developer: MoonlightLaboratory
  category: Media
  title:
    en_US: Rexarr
  tagline:
    en_US: Remux-first transcoding and disc ripping for the *arr stack
  description:
    en_US: |
      Rexarr sits next to Radarr, Sonarr and Lidarr and takes care of the part they do not: the encoding.

      It finds Blu-ray remux and full-disc releases for the titles you choose, follows the download until the *arr
      app has imported it, and then re-encodes the file with FFmpeg using a profile you control - container, video
      encoder, quality, audio tracks, subtitles, output naming - with presets for movies, TV, anime and music.
      Hardware encoding through QuickSync, VAAPI, NVENC, AMF or VideoToolbox is a dropdown and a test button away.

      It is also an automatic ripping machine. Insert a DVD or Blu-ray and Rexarr identifies it against your own
      library, rips the titles you want with MakeMKV, encodes them, and hands the finished files to Radarr or
      Sonarr - checking afterwards that they really were imported, rather than trusting the app to say so.

      Music is handled too: the Lidarr library, album search through indexers and Soulseek, audio CD ripping to
      FLAC with MusicBrainz tags, and single-file albums with a cue sheet split into tracks so Lidarr can import
      them.

      Rexarr is free software (GPL-3.0) and in beta. Disc ripping needs MakeMKV, which may not be redistributed, so
      this image cannot rip on its own - everything else works out of the box.
  tips:
    before_install:
      en_US: |
        Mount your media at the same path Radarr and Sonarr use, or add the translation under
        Settings - Path mappings. Set PUID and PGID to the user that owns your shares.
  icon: https://cdn.jsdelivr.net/gh/MoonlightLaboratory/rexarr@main/distribution/casaos/Apps/Rexarr/icon.svg
  thumbnail: https://cdn.jsdelivr.net/gh/MoonlightLaboratory/rexarr@main/distribution/casaos/Apps/Rexarr/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/MoonlightLaboratory/rexarr@main/distribution/casaos/Apps/Rexarr/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/MoonlightLaboratory/rexarr@main/distribution/casaos/Apps/Rexarr/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/MoonlightLaboratory/rexarr@main/distribution/casaos/Apps/Rexarr/screenshot-3.png
  index: /
  version: "0.1.7.2"
  update_at: "2026-10-08"
  port_map: "3939"
  scheme: http
  website: https://moonlightlaboratory.github.io/rexarr/
  repo: https://github.com/MoonlightLaboratory/rexarr
  support: https://github.com/MoonlightLaboratory/rexarr/issues
  docs: https://moonlightlaboratory.github.io/rexarr/
