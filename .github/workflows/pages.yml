name: Publish RexDB

# The branch is the website: index.html reads index.json, which the checker builds from the entries. There is
# nothing to compile, so this uploads the branch as it stands.
on:
  push:
    branches: [RexDB]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rexdb-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # never publish a database that does not pass its own checker
      - run: node scripts/validate.mjs --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
