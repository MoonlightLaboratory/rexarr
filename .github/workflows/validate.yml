name: Validate RexDB

on:
  push:
    branches: [RexDB]
  pull_request:
    branches: [RexDB]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # no install step: the checker has no dependencies, so there is nothing to audit or pin
      - run: node scripts/validate.mjs --check
