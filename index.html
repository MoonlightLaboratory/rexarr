<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RexDB — what is on which disc</title>
    <meta name="description" content="A crowdsourced map of which episode is on which part of which disc." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6.5' fill='none' stroke='%23e8b931' stroke-width='1.6'/><circle cx='8' cy='8' r='1.9' fill='%23e8b931'/></svg>" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap">
        <div class="brand">
          <svg class="disc-mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35" />
            <circle cx="16" cy="16" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6" />
            <circle cx="16" cy="16" r="4" fill="currentColor" />
          </svg>
          <h1>Rex<span>DB</span></h1>
        </div>
        <p class="lede">
          Which episode is on which part of which disc. A disc never says — so somebody works it out once, and
          nobody else has to.
        </p>
        <dl class="stats" id="stats"></dl>
      </div>
    </header>

    <div class="bar">
      <div class="wrap barInner">
        <div class="searchWrap">
          <svg class="searchIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
          <input
            type="search"
            id="q"
            placeholder="Search a disc label, a series, a TVDB id, a barcode, a fingerprint…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search the database"
          />
          <kbd class="slash">/</kbd>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
      </div>
    </div>

    <main class="wrap" id="results" aria-live="polite"></main>

    <footer class="wrap">
      <nav>
        <a href="https://github.com/MoonlightLaboratory/rexarr/tree/RexDB">The data</a>
        <a href="https://github.com/MoonlightLaboratory/rexarr/blob/RexDB/CONTRIBUTING.md">Add a disc</a>
        <a href="https://github.com/MoonlightLaboratory/rexarr/blob/RexDB/FINGERPRINT.md">How a disc is recognised</a>
        <a href="./index.json">index.json</a>
      </nav>
      <p>Public domain (CC0). Built for <a href="https://github.com/MoonlightLaboratory/rexarr">Rexarr</a>, readable by anything.</p>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
