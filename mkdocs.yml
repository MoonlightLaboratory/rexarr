# Rexarr documentation site (https://moonlightlaboratory.github.io/rexarr/)
#
#   pip install mkdocs-material
#   mkdocs serve            # http://127.0.0.1:8000
#   mkdocs build --strict   # what CI builds (.github/workflows/docs.yml)
site_name: Rexarr
site_description: Remux-first transcoding, disc ripping and music companion for the *arr stack.
site_url: https://moonlightlaboratory.github.io/rexarr/
site_author: MoonlightLaboratory
repo_url: https://github.com/MoonlightLaboratory/rexarr
repo_name: MoonlightLaboratory/rexarr
edit_uri: edit/main/docs/
copyright: Rexarr is free software under the GNU General Public License v3.0.
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  # System fonts: no render-blocking request to Google Fonts on every page load.
  font: false
  logo: assets/rexarr-wordmark.svg
  favicon: assets/rexarr-icon.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
  features:
    # No navigation.instant: the theme would fetch each page itself and swap the DOM, which looks
    # frozen for the 150-270ms that takes - the browser's own loading indicator is immediate.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MoonlightLaboratory/rexarr
      name: Rexarr on GitHub
    - icon: fontawesome/brands/docker
      link: https://github.com/MoonlightLaboratory/rexarr/pkgs/container/rexarr
      name: Container image
  generator: false

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Requirements: getting-started/requirements.md
      - Install from a release: getting-started/install.md
      - Docker: getting-started/docker.md
      - NAS and home servers: getting-started/nas.md
      - Run from source: getting-started/from-source.md
      - First-time setup: getting-started/setup.md
  - Guide:
      - guide/index.md
      - Library: guide/library.md
      - Search: guide/search.md
      - Profiles: guide/profiles.md
      - Transcoding: guide/transcoding.md
      - Auto transcode: guide/auto-transcode.md
      - Disc ripping: guide/disc-ripping.md
      - Music: guide/music.md
      - Local media: guide/local-media.md
      - AniDB for anime: guide/anidb.md
  - Reference:
      - reference/index.md
      - Settings: reference/settings.md
      - System and maintenance: reference/system.md
      - Storage and environment: reference/storage.md
      - API: reference/api.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
  - Release notes: release-notes.md
